{% extends "base.html" %}

{% block title %}Files - PowerPoint Audit Trail{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h1 class="mb-4">
            <i class="fas fa-folder me-2"></i>Monitored Files
        </h1>
    </div>
</div>

<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="card-title mb-0">
                    <i class="fas fa-list me-2"></i>PowerPoint Files
                </h5>
                <div class="d-flex align-items-center">
                    <span class="me-3" id="files-count">0 files</span>
                    <button type="button" class="btn btn-primary btn-sm" onclick="refreshFiles()">
                        <i class="fas fa-sync-alt me-1"></i>Refresh
                    </button>
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>File Name</th>
                                <th>Path</th>
                                <th>Last Modified</th>
                                <th>Events</th>
                                <th>Current Size</th>
                                <th>Slides</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="files-table">
                            <tr>
                                <td colspan="7" class="text-center">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    loadFiles();
});

function loadFiles() {
    fetch('/api/files')
        .then(response => response.json())
        .then(data => {
            updateFilesTable(data.files);
            document.getElementById('files-count').textContent = `${data.files.length} files`;
        })
        .catch(error => {
            console.error('Error loading files:', error);
            document.getElementById('files-table').innerHTML = 
                '<tr><td colspan="7" class="text-center text-danger">Error loading files</td></tr>';
        });
}

function updateFilesTable(files) {
    const tbody = document.getElementById('files-table');
    
    if (files.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center">No files found</td></tr>';
        return;
    }
    
    tbody.innerHTML = files.map(file => `
        <tr>
            <td>
                <i class="fas fa-file-powerpoint me-2 text-primary"></i>
                <strong>${file.file_path.split('/').pop()}</strong>
            </td>
            <td>
                <small class="text-muted">${file.file_path}</small>
            </td>
            <td>${formatDateTime(file.last_modified)}</td>
            <td>
                <span class="badge bg-info">${file.event_count}</span>
            </td>
            <td>${formatFileSize(file.current_size)}</td>
            <td>
                <span class="badge bg-secondary">${file.current_slides || 0}</span>
            </td>
            <td>
                <a href="/file/${encodeURIComponent(file.file_path)}" class="btn btn-sm btn-outline-primary">
                    <i class="fas fa-eye me-1"></i>Details
                </a>
            </td>
        </tr>
    `).join('');
}

function refreshFiles() {
    const button = event.target;
    const originalText = button.innerHTML;
    button.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Refreshing...';
    button.disabled = true;
    
    loadFiles();
    
    setTimeout(() => {
        button.innerHTML = originalText;
        button.disabled = false;
    }, 1000);
}

function formatDateTime(timestamp) {
    const date = new Date(timestamp);
    return date.toLocaleString();
}

function formatFileSize(bytes) {
    if (!bytes) return '-';
    const sizes = ['Bytes', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(1024));
    return Math.round(bytes / Math.pow(1024, i) * 100) / 100 + ' ' + sizes[i];
}
</script>
{% endblock %}
